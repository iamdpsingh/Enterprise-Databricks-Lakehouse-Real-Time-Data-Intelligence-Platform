# Databricks Asset Bundles (DABs) configuration
# This file defines the infrastructure as code for the Databricks Lakehouse platform.

bundle:
  name: enterprise_lakehouse

variables:
  catalog_name:
    description: "The Unity Catalog name to deploy to."
    default: "main"
  storage_location:
    description: "GCS bucket path for external locations."
    default: "gs://databricks-lakehouse-510903-data"

workspace:
  host: https://your-databricks-instance.gcp.databricks.com

environments:
  dev:
    workspace:
      host: https://dev-databricks-instance.gcp.databricks.com
    variables:
      catalog_name: "dev_catalog"
      storage_location: "gs://databricks-lakehouse-510903-data"
    default: true
    
  prod:
    workspace:
      host: https://prod-databricks-instance.gcp.databricks.com
    variables:
      catalog_name: "prod_catalog"
      storage_location: "gs://enterprise-lakehouse-prod"

# Define the resources (Jobs, DLT Pipelines, Models)
resources:
  # Jobs define automated workflows
  jobs:
    ingestion_job:
      name: "[${bundle.environment}] Data Ingestion"
      
      job_clusters:
        - job_cluster_key: ingestion_cluster
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "n2-standard-4"
            num_workers: 2
            gcp_attributes:
              use_preemptible_executors: false
            
      tasks:
        - task_key: run_autoloader
          job_cluster_key: ingestion_cluster
          spark_python_task:
            python_file: src/ingestion/autoloader.py

    orders_pipeline:
      name: "[${bundle.environment}] Orders End-to-End Pipeline"
      
      job_clusters:
        - job_cluster_key: orders_cluster
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "n2-standard-4"
            num_workers: 2
            
      tasks:
        - task_key: bronze_ingestion
          job_cluster_key: orders_cluster
          spark_python_task:
            python_file: src/pipelines/orders/main.py
            parameters:
              - "--layer"
              - "bronze"
              - "--source-path"
              - "${var.storage_location}/raw/orders"
              - "--bronze-table"
              - "${var.catalog_name}.bronze.orders"
              - "--silver-table"
              - "${var.catalog_name}.silver.orders"
              - "--gold-table"
              - "${var.catalog_name}.gold.order_metrics"
              - "--quarantine-table"
              - "${var.catalog_name}.silver.quarantine_orders"
              - "--checkpoint-path"
              - "${var.storage_location}/checkpoints/orders"

        - task_key: silver_processing
          depends_on:
            - task_key: bronze_ingestion
          job_cluster_key: orders_cluster
          spark_python_task:
            python_file: src/pipelines/orders/main.py
            parameters:
              - "--layer"
              - "silver"
              - "--bronze-table"
              - "${var.catalog_name}.bronze.orders"
              - "--silver-table"
              - "${var.catalog_name}.silver.orders"
              - "--gold-table"
              - "${var.catalog_name}.gold.order_metrics"
              - "--quarantine-table"
              - "${var.catalog_name}.silver.quarantine_orders"

        - task_key: gold_aggregation
          depends_on:
            - task_key: silver_processing
          job_cluster_key: orders_cluster
          spark_python_task:
            python_file: src/pipelines/orders/main.py
            parameters:
              - "--layer"
              - "gold"
              - "--bronze-table"
              - "${var.catalog_name}.bronze.orders"
              - "--silver-table"
              - "${var.catalog_name}.silver.orders"
              - "--gold-table"
              - "${var.catalog_name}.gold.order_metrics"
              - "--quarantine-table"
              - "${var.catalog_name}.silver.quarantine_orders"

    inventory_pipeline:
      name: "[${bundle.environment}] Inventory End-to-End Pipeline"
      
      job_clusters:
        - job_cluster_key: inventory_cluster
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "n2-standard-4"
            num_workers: 2
            
      tasks:
        - task_key: bronze_ingestion
          job_cluster_key: inventory_cluster
          spark_python_task:
            python_file: src/pipelines/inventory/main.py
            parameters:
              - "--layer"
              - "bronze"
              - "--source-path"
              - "${var.storage_location}/raw/inventory"
              - "--bronze-table"
              - "${var.catalog_name}.bronze.inventory"
              - "--silver-table"
              - "${var.catalog_name}.silver.inventory"
              - "--gold-table"
              - "${var.catalog_name}.gold.inventory_metrics"
              - "--quarantine-table"
              - "${var.catalog_name}.silver.quarantine_inventory"
              - "--checkpoint-path"
              - "${var.storage_location}/checkpoints/inventory"

        - task_key: silver_processing
          depends_on:
            - task_key: bronze_ingestion
          job_cluster_key: inventory_cluster
          spark_python_task:
            python_file: src/pipelines/inventory/main.py
            parameters:
              - "--layer"
              - "silver"
              - "--bronze-table"
              - "${var.catalog_name}.bronze.inventory"
              - "--silver-table"
              - "${var.catalog_name}.silver.inventory"
              - "--gold-table"
              - "${var.catalog_name}.gold.inventory_metrics"
              - "--quarantine-table"
              - "${var.catalog_name}.silver.quarantine_inventory"

        - task_key: gold_aggregation
          depends_on:
            - task_key: silver_processing
          job_cluster_key: inventory_cluster
          spark_python_task:
            python_file: src/pipelines/inventory/main.py
            parameters:
              - "--layer"
              - "gold"
              - "--bronze-table"
              - "${var.catalog_name}.bronze.inventory"
              - "--silver-table"
              - "${var.catalog_name}.silver.inventory"
              - "--gold-table"
              - "${var.catalog_name}.gold.inventory_metrics"
              - "--quarantine-table"
              - "${var.catalog_name}.silver.quarantine_inventory"
              - "--checkpoint-path"
              - "${var.storage_location}/checkpoints/inventory"

    trips_pipeline:
      name: "[${bundle.environment}] NYC Taxi Trips 100M Pipeline"
      
      job_clusters:
        - job_cluster_key: trips_cluster
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "n2-standard-4"
            num_workers: 4 # Higher workers for 146M rows
            
      tasks:
        - task_key: bronze_ingestion
          job_cluster_key: trips_cluster
          spark_python_task:
            python_file: src/pipelines/trips/main.py
            parameters:
              - "--layer"
              - "bronze"
              - "--source-path"
              - "${var.storage_location}/landing/nyc_taxi_2015"
              - "--bronze-table"
              - "${var.catalog_name}.bronze.trips"
              - "--silver-table"
              - "${var.catalog_name}.silver.trips"
              - "--gold-table"
              - "${var.catalog_name}.gold.trips_metrics"
              - "--quarantine-table"
              - "${var.catalog_name}.silver.quarantine_trips"
              - "--checkpoint-path"
              - "${var.storage_location}/checkpoints/trips"

        - task_key: silver_processing
          depends_on:
            - task_key: bronze_ingestion
          job_cluster_key: trips_cluster
          spark_python_task:
            python_file: src/pipelines/trips/main.py
            parameters:
              - "--layer"
              - "silver"
              - "--bronze-table"
              - "${var.catalog_name}.bronze.trips"
              - "--silver-table"
              - "${var.catalog_name}.silver.trips"
              - "--gold-table"
              - "${var.catalog_name}.gold.trips_metrics"
              - "--quarantine-table"
              - "${var.catalog_name}.silver.quarantine_trips"
              - "--checkpoint-path"
              - "${var.storage_location}/checkpoints/trips"

        - task_key: gold_aggregation
          depends_on:
            - task_key: silver_processing
          job_cluster_key: trips_cluster
          spark_python_task:
            python_file: src/pipelines/trips/main.py
            parameters:
              - "--layer"
              - "gold"
              - "--bronze-table"
              - "${var.catalog_name}.bronze.trips"
              - "--silver-table"
              - "${var.catalog_name}.silver.trips"
              - "--gold-table"
              - "${var.catalog_name}.gold.trips_metrics"
              - "--quarantine-table"
              - "${var.catalog_name}.silver.quarantine_trips"
              - "--checkpoint-path"
              - "${var.storage_location}/checkpoints/trips"
