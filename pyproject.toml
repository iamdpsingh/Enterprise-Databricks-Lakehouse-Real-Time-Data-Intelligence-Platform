[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse"
version = "0.1.0"
description = "Enterprise Databricks Lakehouse & Real-Time Data Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dhruv Pratap Singh", email = "iamdpsingh@gmail.com" }]
keywords = ["databricks", "spark", "delta-lake", "data-engineering", "lakehouse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    # Spark / Databricks
    "pyspark>=3.5.0",
    "delta-spark>=3.0.0",

    # GCP
    "google-cloud-storage>=2.14.0",
    "google-cloud-secret-manager>=2.18.0",
    "google-cloud-bigquery>=3.17.0",

    # Data
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",

    # Config & Utilities
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.3",     # Retry logic

    # Logging & Observability
    "structlog>=24.1.0",
    "opentelemetry-sdk>=1.23.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "chispa>=0.9.4",           # PySpark DataFrame equality assertions

    # Linting & Formatting
    "ruff>=0.3.0",

    # Type Checking
    "mypy>=1.8.0",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.31.0",

    # Security
    "bandit[toml]>=1.7.7",
    "pip-audit>=2.7.2",

    # Pre-commit
    "pre-commit>=3.6.0",
]

[project.scripts]
# Entry points for Databricks Wheel tasks
ingest-bronze = "lakehouse.ingestion.entrypoints:ingest_bronze"
transform-silver = "lakehouse.transformations.entrypoints:transform_silver"
build-gold = "lakehouse.transformations.entrypoints:build_gold"

[tool.setuptools.packages.find]
where = ["src"]

# ─── Ruff (Linting + Formatting) ──────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "S",    # bandit (security)
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "S101",  # Allow assert in tests
    "S105",  # Allow hardcoded passwords in tests
    "B008",  # Allow function calls in default args (FastAPI patterns)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "N"]   # Relax security and naming in tests

[tool.ruff.lint.isort]
known-first-party = ["lakehouse"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ─── Mypy (Type Checking) ──────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "notebooks/"]

[[tool.mypy.overrides]]
module = ["pyspark.*", "delta.*", "chispa.*"]
ignore_missing_imports = true

# ─── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=85",
]
markers = [
    "unit: Fast unit tests with mocked dependencies",
    "integration: Tests requiring a Databricks cluster or GCP services",
    "data_quality: Tests validating data quality rules and quarantine logic",
    "performance: Benchmark and SLA performance tests",
    "slow: Tests that take > 30 seconds",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pyspark",
    "ignore::UserWarning:pyspark",
]

# ─── Bandit (Security) ────────────────────────────────────────────────────────
[tool.bandit]
targets = ["src"]
severity = "medium"
confidence = "medium"
exclude_dirs = ["tests", "notebooks"]
skips = ["B101"]  # Allow assert statements
