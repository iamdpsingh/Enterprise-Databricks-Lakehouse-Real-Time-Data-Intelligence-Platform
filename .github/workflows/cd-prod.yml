name: CD Production Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-databricks:
    runs-on: ubuntu-latest
    needs: [test] # Would depend on CI in a real workflow, simulating here
    steps:
    - uses: actions/checkout@v4

    - name: Deploy to Databricks Workspace
      uses: databricks/databricks-cli-action@v1
      with:
        databricks-host: ${{ secrets.DATABRICKS_HOST }}
        databricks-token: ${{ secrets.DATABRICKS_TOKEN }}
        command: bundle deploy -t prod
        
    - name: Deploy Next.js Monitoring UI to Vercel
      uses: amondnet/vercel-action@v20
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./monitoring-ui
        vercel-args: '--prod'
