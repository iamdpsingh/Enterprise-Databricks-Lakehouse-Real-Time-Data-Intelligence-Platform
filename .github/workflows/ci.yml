name: CI — Lint, Test, and Security Scan

on:
  pull_request:
    branches: [main, staging, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "20"

jobs:
  # ─── Python Linting & Formatting ─────────────────────────────────────────────
  python-lint:
    name: Python Lint & Format (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff — Lint
        run: ruff check . --output-format=github

      - name: Ruff — Format Check
        run: ruff format --check .

  # ─── Python Type Checking ─────────────────────────────────────────────────────
  python-types:
    name: Python Type Check (Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Mypy
        run: mypy src/

  # ─── Python Unit Tests ────────────────────────────────────────────────────────
  python-tests:
    name: Python Unit Tests (Pytest)
    runs-on: ubuntu-latest
    needs: [python-lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short -m "not integration and not performance"

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ─── Python Security Scan ─────────────────────────────────────────────────────
  python-security:
    name: Python Security Scan (Bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: pip install bandit[toml] pip-audit

      - name: Bandit — SAST scan
        run: bandit -r src/ -c pyproject.toml -ll --exit-zero

      - name: pip-audit — dependency vulnerability scan
        run: pip-audit --desc

  # ─── SQL Validation ───────────────────────────────────────────────────────────
  sql-lint:
    name: SQL Lint (SQLFluff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install SQLFluff
        run: pip install sqlfluff

      - name: SQLFluff — Lint
        run: |
          if find sql/ databricks/sql/ -name "*.sql" | grep -q .; then
            sqlfluff lint sql/ databricks/sql/ --dialect sparksql
          else
            echo "No SQL files found yet — skipping lint"
          fi

  # ─── Next.js Checks ───────────────────────────────────────────────────────────
  nextjs-checks:
    name: Next.js Lint, Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitoring-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: monitoring-ui/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "monitoring-ui not yet initialized — skipping"
          fi

      - name: ESLint
        run: |
          if [ -f package.json ]; then npm run lint; fi

      - name: TypeScript type check
        run: |
          if [ -f package.json ]; then npx tsc --noEmit; fi

      - name: Build
        run: |
          if [ -f package.json ]; then npm run build; fi

  # ─── Infrastructure Validation ────────────────────────────────────────────────
  terraform-validate:
    name: Terraform Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        run: |
          if find infrastructure/terraform -name "*.tf" | grep -q .; then
            terraform fmt -check -recursive infrastructure/terraform/
          else
            echo "No Terraform files yet — skipping"
          fi

      - name: Terraform Validate (dev)
        run: |
          if [ -f infrastructure/terraform/envs/dev/main.tf ]; then
            cd infrastructure/terraform/envs/dev
            terraform init -backend=false
            terraform validate
          else
            echo "Terraform dev env not yet configured — skipping"
          fi

  # ─── Markdown Lint ────────────────────────────────────────────────────────────
  docs-lint:
    name: Documentation Lint (Markdownlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint Markdown files
        run: markdownlint "**/*.md" --ignore node_modules --ignore .next

  # ─── Secret Scanning ──────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog — Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ─── CI Summary Gate ─────────────────────────────────────────────────────────
  ci-success:
    name: CI — All Gates Passed
    runs-on: ubuntu-latest
    needs:
      - python-lint
      - python-types
      - python-tests
      - python-security
      - sql-lint
      - nextjs-checks
      - terraform-validate
      - docs-lint
      - secret-scan
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more CI gates failed."
            exit 1
          fi
          echo "All CI gates passed. Ready for review."
